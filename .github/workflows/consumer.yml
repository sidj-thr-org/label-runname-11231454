name: Consumer
run-name: "saw ${{ github.event.workflow_run.id }}"
on:
  workflow_run:
    workflows: [PR checks]
    types: [requested]
permissions:
  actions: read
jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ github.event.workflow_run.id }}
          PAYLOAD: ${{ github.event.workflow_run.display_title }}
        run: |
          echo "RESULT payload=[$PAYLOAD]"
          echo "RESULT api_at_start=[$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ID" --jq .display_title)]"
